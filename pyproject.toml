[project]
name = "abcprint"
version = "0.1.0"
description = "Document compilation and compliance verification for thesis-style documents"
requires-python = ">=3.11"
dependencies = ["pypdf>=3.9", "PyYAML>=6.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The package lives under src/ and the image sets PYTHONPATH=/srv/src, so tests need the
# same for `pytest` to work in a clone without anyone exporting it first.
pythonpath = ["src"]
testpaths = ["tests"]
