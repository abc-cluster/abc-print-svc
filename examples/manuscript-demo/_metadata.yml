  - name: Ada Example
    corresponding: true
    email: ada.example@example.invalid
    affiliations:
      - id: id1
        name: Institute of Demonstration Studies
        department: Department of Fixtures
        city: Exampleton
        country: Nowhere
  - name: Bo Sample
    affiliations:
